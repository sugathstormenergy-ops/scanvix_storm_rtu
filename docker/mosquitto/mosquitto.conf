# =============================================================================
# Storm Energy RTU — Docker Mosquitto broker (storm-rtu "mosquitto" service)
# SEPARATE from the host Mosquitto service on 192.168.0.50:1883 (untouched).
# Container port 1883 is published on host port ${MQTT_HOST_PORT} (default 1884).
# =============================================================================
per_listener_settings false

listener 1883 0.0.0.0
protocol mqtt

# Authentication is mandatory. The password file is (re)generated at container
# start by /storm/entrypoint.sh from MQTT_USERNAME / MQTT_PASSWORD in .env.
allow_anonymous false
password_file /mosquitto/data/passwd

# Persistence (named volume storm-rtu-mosquitto-data)
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# Log to stdout only -> Docker json-file driver with rotation (see compose.yml)
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S
connection_messages true

max_keepalive 300
