# =============================================================================
# Storm Energy RTU - frontend static server (inside the storm-frontend container).
# Only reachable on the internal Docker network; the reverse-proxy service routes
# "/" here and /api, /health to storm-api. This server never proxies the API itself:
# an /api/... request that reaches it is answered 404 (never with index.html).
# =============================================================================
server_tokens off;

server {
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;

    access_log off;
    error_log /dev/stderr warn;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Applied to every response below (add_header is not inherited once a location
    # declares its own, so each location repeats the include-style block).
    set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.tile.openstreetmap.org https://server.arcgisonline.com; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Content-hashed build assets: safe to cache for a long time.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy $csp always;
        try_files $uri =404;
    }

    # Never serve the SPA for API-looking paths (defence in depth; the proxy routes them).
    location ^~ /api/ { return 404; }
    location = /api   { return 404; }

    # Everything else: real file, or index.html for client-side routes (/gis-map, ...).
    # index.html must never be cached so a new deployment is picked up immediately.
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Content-Security-Policy $csp always;
        try_files $uri /index.html;
    }
}
