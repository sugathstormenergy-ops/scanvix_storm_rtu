---
# Storm Energy RTU — Per-device MQTT credential provisioning (Phase 4 design)
#
# NOT included by any playbook (verified via grep across playbooks/ and
# roles/**/tasks/main.yml) -- this file exists as source-of-truth design
# only. A future, explicitly-authorized phase would add a
# `tasks_from: device_credentials` include, one device at a time, guarded
# by scanvix_mqtt_acl_enabled and a per-run device_id variable.
#
# Intended invocation (future, NOT wired up):
#   ansible-playbook playbooks/mqtt/provision_device.yml \
#     -e device_id=864012049873321 \
#     -e scanvix_mqtt_secrets_dir=/secure/path/outside/repo
#
# Design goals satisfied here (see Phase 4 report items K/M):
#   1. One credential per device, generated (never hand-typed), never
#      hardcoded in source.
#   2. Password never appears on the command line / --extra-vars / stdout
#      / Ansible logs -- generated by the `password` lookup, evaluated on
#      the controller, and immediately marked no_log for every task that
#      touches its value.
#   3. Idempotent: the `password` lookup persists the generated value to
#      a file under scanvix_mqtt_secrets_dir on first use and reuses it on
#      subsequent runs -- re-running this file for the same device_id does
#      NOT rotate its password.
#   4. Provisioning one device never touches another device's entry in
#      the password file (mosquitto_passwd -b updates/adds a single
#      username in place; it does not rewrite the whole file).
#   5. device_id is validated BEFORE it is used in any username, topic,
#      filename, or shell command -- via the same rules as
#      backend/app/protocol/device_identity.py (15 ASCII digits only).

- name: MQTT DEVICE CREDENTIALS | Safety check -- secrets dir must be set and outside the repo
  ansible.builtin.assert:
    that:
      - scanvix_mqtt_secrets_dir is defined
      - scanvix_mqtt_secrets_dir | length > 0
      - "'storm-energy-rtu' not in scanvix_mqtt_secrets_dir"
    fail_msg: >-
      scanvix_mqtt_secrets_dir must be set to a controller-side path OUTSIDE
      this git repository before device credentials can be provisioned.
      Refusing to run: either it is unset, empty, or looks like it is
      inside the storm-energy-rtu repo (which would risk committing
      generated passwords).
  tags: [mqtt, mqtt_devices]

- name: MQTT DEVICE CREDENTIALS | Validate device_id is exactly 15 ASCII digits (Scanvix IMEI format)
  ansible.builtin.assert:
    that:
      - device_id is defined
      - device_id is string
      # Ansible/Jinja regex test; ASCII-only via explicit [0-9], matches
      # the same rule as app.protocol.device_identity._IMEI_RE.
      - device_id is match('^[0-9]{15}$')
    fail_msg: >-
      device_id must be defined and be exactly 15 ASCII digits (Scanvix
      IMEI format). Refusing to derive a username, topic, filename, or
      shell command from an unvalidated value.
  tags: [mqtt, mqtt_devices]

- name: MQTT DEVICE CREDENTIALS | Derive device username and topic root (validated device_id only)
  ansible.builtin.set_fact:
    _device_username: "rtu_{{ device_id }}"
    _device_topic_root: "storm/meters/{{ device_id }}"
  tags: [mqtt, mqtt_devices]

# The `password` lookup generates a random password on first evaluation
# and, when chattr/state file support is available, persists it under
# scanvix_mqtt_secrets_dir/<username> for reuse on subsequent runs. This
# keeps provisioning idempotent without the value ever crossing
# --extra-vars, stdout, or a Git-tracked file.
- name: MQTT DEVICE CREDENTIALS | Generate or reuse this device's password (controller-side, never logged)
  ansible.builtin.set_fact:
    _device_password: "{{ lookup('ansible.builtin.password', scanvix_mqtt_secrets_dir + '/' + _device_username, length=32, chars=['ascii_letters', 'digits']) }}"
  no_log: true
  tags: [mqtt, mqtt_devices]

# mosquitto_passwd -b adds/updates exactly one username in place; it does
# not rewrite or truncate the rest of the file, so other devices' entries
# (and, in the device_passwd file's case, no other credential lives here
# at all -- see scanvix_mqtt_device_passwd_file, kept separate from
# storm_passwd/allipuram_ingest and bench_passwd) are left untouched.
- name: MQTT DEVICE CREDENTIALS | Ensure the dedicated device password file exists
  ansible.windows.win_stat:
    path: "{{ scanvix_mqtt_device_passwd_file }}"
  register: _device_passwd_file_stat
  tags: [mqtt, mqtt_devices]

- name: MQTT DEVICE CREDENTIALS | Create the device password file if it does not exist yet (-c, first run only)
  ansible.windows.win_command:
    cmd: >-
      mosquitto_passwd.exe -b -c
      "{{ scanvix_mqtt_device_passwd_file }}"
      "{{ _device_username }}"
      "{{ _device_password }}"
  when: not _device_passwd_file_stat.stat.exists
  no_log: true
  tags: [mqtt, mqtt_devices]

- name: MQTT DEVICE CREDENTIALS | Add or update this device's entry (subsequent runs, file already exists)
  ansible.windows.win_command:
    cmd: >-
      mosquitto_passwd.exe -b
      "{{ scanvix_mqtt_device_passwd_file }}"
      "{{ _device_username }}"
      "{{ _device_password }}"
  when: _device_passwd_file_stat.stat.exists
  no_log: true
  tags: [mqtt, mqtt_devices]

- name: MQTT DEVICE CREDENTIALS | Confirm provisioning without ever printing the password
  ansible.builtin.debug:
    msg: >-
      Device {{ device_id }} provisioned: username={{ _device_username }},
      topic_root={{ _device_topic_root }}. Password generated/reused
      controller-side under scanvix_mqtt_secrets_dir; never displayed.
  tags: [mqtt, mqtt_devices]

# NOTE (future phase, not implemented here): after this task file is
# actually wired into a playbook, the device would also need to be
# appended to scanvix_mqtt_devices (or inventory/device_registry.yml) so
# that storm_acl.j2 renders its topic ACL stanza -- that registry update
# is deliberately a separate, explicit step, not automated by this task
# file, so that a credential can exist without silently granting ACL
# access (or vice versa) as an unintended side effect of one task run.
