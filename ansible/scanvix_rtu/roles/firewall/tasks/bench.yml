---
# Storm Energy RTU — Firewall Role — MQTT Bench Rule Only
#
# Creates ONLY the temporary office-LAN MQTT bench firewall rule (TCP port from
# scanvix_mqtt_bench_port -- currently 1885). Port 1884 is an existing, unrelated
# Mosquitto listener and is never touched by this file.
# Deliberately separate from tasks/main.yml so a bench-only deploy never
# re-runs the 3 unrelated production rule tasks (API/MQTT/TCP).
#
# SAFETY: TCP only, single port only, Private/Domain profile only (no
# Public), gated on scanvix_mqtt_bench_enabled, never touches any existing
# rule, never touches port 8088.

- name: FIREWALL-BENCH | Create bench rule {{ scanvix_fw_mqtt_bench_rule | default('') }}
  community.windows.win_firewall_rule:
    name:      '{{ scanvix_fw_mqtt_bench_rule }}'
    localport: '{{ scanvix_mqtt_bench_port }}'
    action:    allow
    direction: in
    protocol:  tcp
    profiles:  private,domain
    state:     present
    enabled:   true
    description: 'Storm Energy RTU -- TEMPORARY office bench MQTT listener (port {{ scanvix_mqtt_bench_port }}) -- remove after RTU bench test'
  when: scanvix_mqtt_bench_enabled | default(false) | bool

- name: FIREWALL-BENCH | Confirm bench rule (if enabled)
  ansible.windows.win_shell: |
    $rule = Get-NetFirewallRule -DisplayName '{{ scanvix_fw_mqtt_bench_rule | default("") }}' -ErrorAction SilentlyContinue
    if ($rule) { "OK  {{ scanvix_fw_mqtt_bench_rule | default('') }}  Enabled=$($rule.Enabled)  Profile=$($rule.Profile)" }
    else { "MISSING  {{ scanvix_fw_mqtt_bench_rule | default('') }}" }
  register: fw_bench_confirm
  changed_when: false
  when: scanvix_mqtt_bench_enabled | default(false) | bool

- name: FIREWALL-BENCH | Bench rule confirmation (if enabled)
  ansible.builtin.debug:
    msg: "{{ fw_bench_confirm.stdout | default('(bench firewall rule disabled -- scanvix_mqtt_bench_enabled is false)') }}"
