          ╠══════════════════════════════════════════════════════════════════════╣
          ║  3. MOSQUITTO STATUS (StormMosquitto broker)                         ║
          ║     {{ port1883_check.stdout | trim | truncate(64) }}
          ╠══════════════════════════════════════════════════════════════════════╣
          ║  4. API STATUS (StormEnergyRTU-API)                                  ║
          ║     {{ svc_snapshot.stdout_lines | select('match','.*'+scanvix_api_service_name+'.*') | first | default('NOT REPORTED') | truncate(64) }}
          ╠══════════════════════════════════════════════════════════════════════╣
          ║  5. MQTT CONSUMER STATUS                                             ║
          ║     Running inside StormEnergyRTU-API (single-process architecture) ║
