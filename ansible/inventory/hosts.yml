---
# Storm Energy RTU Platform — Ansible Inventory
# Replace ip/hostname values with actual server addresses before deployment.

all:
  vars:
    ansible_user: storm
    ansible_become: true
    ansible_become_method: sudo
    ansible_python_interpreter: /usr/bin/python3

  hosts:
    rtu-server-01:
      ansible_host: 192.168.1.10          # REPLACE with actual server IP
      ansible_port: 22

  children:
    rtu_servers:
      hosts:
        rtu-server-01:
