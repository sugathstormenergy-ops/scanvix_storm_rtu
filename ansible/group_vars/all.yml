---
# Storm Energy RTU Platform — Group variables
# Sensitive values (marked !!VAULT!!) must be replaced with:
#   ansible-vault encrypt_string '<value>' --name '<key>'

# ── Application ───────────────────────────────────────────────────────────────
app_name:     storm-energy-rtu
app_env:      production
app_version:  "1.0.0"
app_user:     storm-rtu
app_group:    storm-rtu
app_base_dir: /opt/storm-rtu
app_log_dir:  /var/log/storm-rtu
app_cert_dir: /etc/storm-rtu/certs
python_version: "3.11"

# ── API ───────────────────────────────────────────────────────────────────────
api_host: "0.0.0.0"
api_port: 8000

# Secret — store in Ansible Vault
api_secret_key: "!!VAULT!! replace with: ansible-vault encrypt_string"

# ── SQL Server ────────────────────────────────────────────────────────────────
sql_server:   "192.168.1.20"              # REPLACE with actual SQL Server IP
sql_port:     1433
sql_database: STORM_ENERGY_RTU
sql_driver:   "ODBC Driver 17 for SQL Server"

# Secrets — store in Ansible Vault
sql_username: "!!VAULT!! storm_rtu_user"
sql_password: "!!VAULT!! replace with vault encrypted value"

# ── MQTT ──────────────────────────────────────────────────────────────────────
mqtt_host:         "{{ ansible_host }}"
mqtt_port:         1883
mqtt_tls_port:     8883
mqtt_tls_enabled:  false
mqtt_client_id:    storm-rtu-consumer

# Secrets — store in Ansible Vault
mqtt_username: "!!VAULT!! storm_mqtt_user"
mqtt_password: "!!VAULT!! replace with vault encrypted value"

# ── TCP ───────────────────────────────────────────────────────────────────────
tcp_host:     "0.0.0.0"
tcp_port:     8100

# ── Firewall ports ────────────────────────────────────────────────────────────
firewall_allowed_ports:
  - { port: 22,   proto: tcp, comment: "SSH" }
  - { port: 1883, proto: tcp, comment: "MQTT" }
  - { port: 8883, proto: tcp, comment: "MQTT TLS" }
  - { port: 8100, proto: tcp, comment: "RTU TCP" }
  - { port: 8000, proto: tcp, comment: "Storm RTU API" }
